[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keepout"
version = "0.1.0"
description = "A lightweight CLI tool to physically lock code logic using formal verification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.12.0",
    "click>=8.0.0",
]

[project.scripts]
keepout = "keepout.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
