[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keepout"
version = "1.0.0"
description = "Lightweight code protection CLI powered by Smart Syntax Locking and Property-Based Testing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
keepout = "keepout.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
